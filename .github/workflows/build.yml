name: Build APK and IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Download sing-box for Android ARM64
        run: |
          SINGBOX_VERSION="1.10.7"
          ASSETS_DIR="android/app/src/main/assets"
          mkdir -p "$ASSETS_DIR"

          # Download sing-box Android ARM64 binary
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VERSION}/sing-box-${SINGBOX_VERSION}-android-arm64.tar.gz" \
            -O /tmp/sing-box-android-arm64.tar.gz

          # Extract and copy the binary
          tar -xzf /tmp/sing-box-android-arm64.tar.gz -C /tmp/
          cp "/tmp/sing-box-${SINGBOX_VERSION}-android-arm64/sing-box" "${ASSETS_DIR}/sing-box"
          chmod +x "${ASSETS_DIR}/sing-box"

          # Cleanup
          rm -f /tmp/sing-box-android-arm64.tar.gz
          rm -rf "/tmp/sing-box-${SINGBOX_VERSION}-android-arm64"

          echo "sing-box binary placed in ${ASSETS_DIR}/sing-box"
          ls -la "${ASSETS_DIR}/sing-box"
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk

  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no signing)
        run: flutter build ios --debug --no-codesign

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/Debug-iphoneos/Runner.app Payload/
          zip -r ProxyClient.ipa Payload
        working-directory: .

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-debug
          path: ProxyClient.ipa
